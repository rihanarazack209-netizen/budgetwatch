services:
  - type: web
    name: budgetwatch-api
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: BudgetWatch2024SecureKey!@#$%
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://budgetwatch-rihan.vercel.app
      - key: MONGO_URI
        sync: false
